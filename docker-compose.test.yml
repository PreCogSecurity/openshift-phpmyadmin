version: '2'

# Isolated E2E test stack.
#
# Brings up a MariaDB server and the locally built phpMyAdmin image, then runs
# the E2E test (testing/phpmyadmin_test.py) from the testing-suite image.
# Requires only Docker and docker-compose; no other external services.
#
# Usage: make test
#   (or: docker-compose -f docker-compose.test.yml up -d db phpmyadmin
#        docker-compose -f docker-compose.test.yml run --rm test)

services:
  db:
    image: mariadb:latest
    container_name: phpmyadmin_test_db
    environment:
      - MYSQL_ROOT_PASSWORD=test123

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:testing
    container_name: phpmyadmin_test
    ports:
      - 8091:80
    environment:
      - PMA_HOST=db
    depends_on:
      - db

  test:
    image: phpmyadmin/phpmyadmin:testing-suite
    depends_on:
      - phpmyadmin
    volumes:
      - ./testing:/testing:ro
    working_dir: /testing
    entrypoint:
      - /bin/sh
      - -c
    command: sh /testing/run-e2e-test.sh